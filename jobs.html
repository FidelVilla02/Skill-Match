<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Find Jobs | SkillMatch Toledo</title>

        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <header>
            <nav>
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>

                <div class="logo">
                    <h2>SkillMatch Toledo</h2>
                </div>

                <ul id="navLinks">
                    
                    <li><a href="jobs.html" class="active">Find Jobs</a></li>
                    <li><a href="my-applications.html">My Applications</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>

                <div class="buttons">
                    <span class="nav-user">Hi, <strong id="navName">User</strong></span>
                    <a href="#" id="logoutBtn" class="login">Logout</a>
                </div>
            </nav>
        </header>

        <section class="dashboard">

            <div class="dashboard-head">
                <h1>Find Jobs</h1>
                <p>Welcome back, <strong id="userName">User</strong>! Jobs ranked by how well your skills fit.</p>
            </div>

            <div class="dashboard-filters">
                <input type="text" id="searchInput" placeholder="Search by title, company, or skill...">
                <select id="categoryFilter">
                    <option value="All">All Categories</option>
                </select>
                <select id="typeFilter">
                    <option value="All">Any Job Type</option>
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contractual">Contractual</option>
                    <option value="Internship">Internship</option>
                    <option value="Job-order">Job-order</option>
                </select>
                <select id="sortFilter">
                    <option value="match">Best Match</option>
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                </select>
            </div>

            <div class="job-count">
                <p><span id="jobCount">0</span> job(s) found</p>
            </div>

            <div id="jobGrid" class="job-grid"></div>
        </section>

        <footer>
            <p>&copy; <span data-year>2026</span> SkillMatch Toledo | All Rights Reserved</p>
        </footer>

        <script src="js/utils.js"></script>
        <script src="js/store.js"></script>
        <script src="js/jobs.js"></script>

    </body>
</html>
