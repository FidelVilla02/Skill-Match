<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SkillMatch Toledo</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav>
        <div class="logo">
            <h2>SkillMatch Toledo</h2>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="employer-post.html">Post a Job</a></li>
        </ul>

        <div class="buttons">
            <a href="#" id="logoutBtn" class="login">Logout</a>
        </div>
    </nav>
</header>

<section class="dashboard">

    <div class="dashboard-head">
        <h1>Job Dashboard</h1>
        <p>Welcome back, <strong id="userName">User</strong>! Find jobs that match your skills.</p>
    </div>

    <div class="dashboard-filters">
        <input type="text" id="searchInput" placeholder="Search by title, company, or skill...">
        <select id="categoryFilter">
            <option value="All">All Categories</option>
            <option value="IT">IT</option>
            <option value="Design">Design</option>
            <option value="Finance">Finance</option>
            <option value="Customer Service">Customer Service</option>
            <option value="Engineering">Engineering</option>
        </select>
    </div>

    <div class="job-count">
        <p><span id="jobCount">0</span> job(s) found</p>
    </div>

    <div id="jobGrid" class="job-grid"></div>

</section>

<footer>
    <p>© 2026 SkillMatch Toledo | Application Development and Emerging Techniques Project</p>
</footer>

<script src="js/dashboard.js"></script>

</body>
</html>
